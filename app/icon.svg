<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!--
    The tab icon: a slice, in the locked palette (`art/palette.json`).

    Not a registry asset. The registry covers art the game renders by slug
    (`art/ASSET_PIPELINE.md`); this is browser chrome Next serves by filename
    convention, and it exists mainly so every page load stops 404ing on
    /favicon.ico. Drawn as flat quantized shapes so it sits in the same world
    as the pixel art it will eventually sit beside.
  -->
  <rect width="32" height="32" fill="#1a1214" />
  <path d="M16 4 L28 26 L4 26 Z" fill="#f2c94c" />
  <path d="M16 8 L25 25 L7 25 Z" fill="#c42b2b" />
  <rect x="13" y="14" width="3" height="3" fill="#8c1f22" />
  <rect x="18" y="18" width="3" height="3" fill="#8c1f22" />
  <rect x="12" y="20" width="3" height="3" fill="#8c1f22" />
  <rect x="4" y="26" width="24" height="2" fill="#c99a63" />
</svg>
