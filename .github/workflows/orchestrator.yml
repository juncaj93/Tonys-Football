name: Orchestrator

# The model-driven half of the autonomous lifecycle (`AUTONOMY.md §3`).
#
# ## OFF BY COMMISSIONER DECISION, 2026-07-30: the league does not pay for API use.
#
# This workflow is the only thing in the repository that ever spent money. It is
# therefore reduced to `workflow_dispatch` only — no schedule, no label trigger,
# no comment trigger. **It cannot fire on its own, and nothing routine invokes
# it.** The file is kept rather than deleted so the design is still legible and
# the decision stays reversible, which is cheaper than rebuilding it from a
# commit message if the answer ever changes.
#
# Two independent guards mean an accidental run costs nothing:
#
#   1. `preflight` skips the whole job unless ANTHROPIC_API_KEY is set. With the
#      secret removed — the recommended state — a manual dispatch is a no-op.
#   2. A credit failure is reported as a warning rather than a red build, so a
#      dispatch against an unfunded key does not look like a broken repository.
#
# ## What replaces it
#
# Nothing needs to. The lifecycle in `AUTONOMY.md §3` is driven by labels in this
# repository, not by this file — the labels are the state, and the actor is
# whoever is reading them. `agents/*.md` are role contracts, and they work
# identically whether a workflow or a person opens them.
#
# The gates that matter never depended on a key and still run on every pull
# request: `ci.yml` (typecheck · lint · test · build) and `visual-qa.yml`
# (12 states x 3 widths against a production build). That split was deliberate
# from the start, and this decision is exactly the case it was built for.
#
# ## No product scope is lost
#
# Generative AI in this product is limited to Tony's Tuesday Slice, and `16 §9`
# already requires that **the Slice publish correctly with the AI API key unset.**
# The template renderer is the default path, not a degraded one. See
# `docs/DEPLOYMENT.md`, which has always specified this key as optional.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to advance (blank = pick highest priority)'
        required: false
        type: string

concurrency:
  # One turn at a time. Two agents on one branch is how a merge conflict becomes
  # a lost ruling.
  group: orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  preflight:
    name: Check the key
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "Key present. Orchestrator armed."
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Orchestrator inert::ANTHROPIC_API_KEY is not set, which is the expected state — the league does not pay for API use (commissioner decision, 2026-07-30). See AUTONOMY.md section 4."
          fi

  turn:
    name: Take one turn
    needs: preflight
    if: needs.preflight.outputs.armed == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tonys
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: tonys_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tonys -d tonys_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://tonys:local_dev_only@localhost:5432/tonys_agent
      SESSION_SECRET: agent_ephemeral_secret_thirty_two_chars_minimum
      SLEEPER_LEAGUE_ID: '1385016656425668608'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations and seed
        run: npm run db:migrate && npm run db:seed

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      # The role file is the prompt. Which one depends on the state the issue is
      # in, so the label drives the actor rather than a human choosing.
      - name: Resolve the actor from the issue label
        id: actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPLICIT: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          pick() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label "$1" --state open \
              --limit 1 --json number --jq '.[0].number // empty'
          }
          if [ -n "${EXPLICIT:-}" ]; then
            NUM="$EXPLICIT"
            LABEL=$(gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | map(select(startswith("ready-") or startswith("implementation-") or startswith("visual-") or startswith("production-"))) | .[0] // "ready-for-build"')
          else
            LABEL=""
            for L in ready-for-visual-qa ready-for-code-review visual-changes-requested ready-for-build ready-for-integration ready-for-production production-verification; do
              NUM=$(pick "$L" || true)
              if [ -n "${NUM:-}" ]; then LABEL="$L"; break; fi
            done
          fi

          if [ -z "${LABEL:-}" ]; then
            echo "role=agents/technical-lead.md" >> "$GITHUB_OUTPUT"
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing queued. Technical lead will decompose the next milestone."
            exit 0
          fi

          case "$LABEL" in
            ready-for-visual-qa)                 ROLE=agents/visual-qa.md ;;
            ready-for-code-review|ready-for-integration|ready-for-production) ROLE=agents/technical-lead.md ;;
            production-verification)             ROLE=agents/release-reviewer.md ;;
            *)                                   ROLE=agents/frontend-worker.md ;;
          esac
          echo "role=$ROLE"   >> "$GITHUB_OUTPUT"
          echo "issue=$NUM"   >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Take the turn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: ${{ steps.actor.outputs.role }}
          ISSUE: ${{ steps.actor.outputs.issue }}
          LABEL: ${{ steps.actor.outputs.label }}
        run: |
          set -uo pipefail
          PROMPT=$(cat <<PROMPT
          You are taking one turn in Tony's autonomous delivery system.

          Read, in this order, and treat them as binding:
            AUTONOMY.md
            VISUAL_ACCEPTANCE.md
            $ROLE
            docs/TECH_LEAD_OPERATING_MODEL.md
            CLAUDE.md

          Issue: ${ISSUE:-none queued}
          State: ${LABEL:-none}

          Take exactly one turn as the role above, then stop. Move the issue to
          its next label so the following turn can happen without a human. If you
          are blocked by a missing credential, permission or payment, label the
          issue blocked-human-only and say precisely what is needed — do not
          guess at a workaround.

          Never print a secret. Green CI is necessary and never sufficient.
          PROMPT
          )

          # The turn is allowed to fail; how it failed decides what that means.
          set +e
          claude -p "$PROMPT" --permission-mode acceptEdits --allowedTools \
              "Bash,Read,Write,Edit,Glob,Grep" \
            > turn.log 2>&1
          STATUS=$?
          set -e

          tail -200 turn.log

          #
          # An unfunded key is not a broken build.
          #
          # Both runs on 2026-07-30 exited on "Credit balance is too low" before the
          # role file was even read, so the first model-driven turn produced nothing
          # at all. The commissioner then decided the league does not pay for API
          # use, which is why this workflow no longer fires on its own.
          #
          # The check stays anyway. Somebody dispatching this manually against a
          # key that has no credit should get one clear warning, not a red X that
          # implies the repository is broken — it is not; it is switched off on
          # purpose.
          #
          if [ "$STATUS" -ne 0 ] && \
             grep -qiE 'credit balance is too low|insufficient (credit|quota|funds)' turn.log; then
            echo "::warning title=Orchestrator is unfunded::The ANTHROPIC_API_KEY account has no credit, so no turn can run. This is expected — the league does not pay for API use (commissioner decision, 2026-07-30). Nothing is broken; see AUTONOMY.md section 4."
            exit 0
          fi

          exit "$STATUS"
