name: Orchestrator

# The model-driven half of the autonomous lifecycle (`AUTONOMY.md §3`).
#
# INERT UNTIL A KEY EXISTS. Every job below is guarded on ANTHROPIC_API_KEY, so
# with no secret set this workflow reports "skipped — no key" and does nothing.
# That is deliberate: a workflow that fails loudly every hour because a secret is
# missing gets switched off, and then nobody notices when the key does arrive.
#
# The deterministic half — ci.yml and visual-qa.yml — needs no key and runs now.
#
# To arm this, see AUTONOMY.md §4 and the setup request on the tracking issue.

on:
  schedule:
    # Hourly, anchored off :00 so it does not collide with every other repo.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to advance (blank = pick highest priority)'
        required: false
        type: string
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  # One turn at a time. Two agents on one branch is how a merge conflict becomes
  # a lost ruling.
  group: orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  preflight:
    name: Check the key
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "Key present. Orchestrator armed."
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Orchestrator inert::ANTHROPIC_API_KEY is not set. See AUTONOMY.md section 4."
          fi

  turn:
    name: Take one turn
    needs: preflight
    if: needs.preflight.outputs.armed == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tonys
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: tonys_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tonys -d tonys_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://tonys:local_dev_only@localhost:5432/tonys_agent
      SESSION_SECRET: agent_ephemeral_secret_thirty_two_chars_minimum
      SLEEPER_LEAGUE_ID: '1385016656425668608'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations and seed
        run: npm run db:migrate && npm run db:seed

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      # The role file is the prompt. Which one depends on the state the issue is
      # in, so the label drives the actor rather than a human choosing.
      - name: Resolve the actor from the issue label
        id: actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPLICIT: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          pick() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label "$1" --state open \
              --limit 1 --json number --jq '.[0].number // empty'
          }
          if [ -n "${EXPLICIT:-}" ]; then
            NUM="$EXPLICIT"
            LABEL=$(gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | map(select(startswith("ready-") or startswith("implementation-") or startswith("visual-") or startswith("production-"))) | .[0] // "ready-for-build"')
          else
            LABEL=""
            for L in ready-for-visual-qa ready-for-code-review visual-changes-requested ready-for-build ready-for-integration ready-for-production production-verification; do
              NUM=$(pick "$L" || true)
              if [ -n "${NUM:-}" ]; then LABEL="$L"; break; fi
            done
          fi

          if [ -z "${LABEL:-}" ]; then
            echo "role=agents/technical-lead.md" >> "$GITHUB_OUTPUT"
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing queued. Technical lead will decompose the next milestone."
            exit 0
          fi

          case "$LABEL" in
            ready-for-visual-qa)                 ROLE=agents/visual-qa.md ;;
            ready-for-code-review|ready-for-integration|ready-for-production) ROLE=agents/technical-lead.md ;;
            production-verification)             ROLE=agents/release-reviewer.md ;;
            *)                                   ROLE=agents/frontend-worker.md ;;
          esac
          echo "role=$ROLE"   >> "$GITHUB_OUTPUT"
          echo "issue=$NUM"   >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Take the turn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: ${{ steps.actor.outputs.role }}
          ISSUE: ${{ steps.actor.outputs.issue }}
          LABEL: ${{ steps.actor.outputs.label }}
        run: |
          set -uo pipefail
          PROMPT=$(cat <<PROMPT
          You are taking one turn in Tony's autonomous delivery system.

          Read, in this order, and treat them as binding:
            AUTONOMY.md
            VISUAL_ACCEPTANCE.md
            $ROLE
            docs/TECH_LEAD_OPERATING_MODEL.md
            CLAUDE.md

          Issue: ${ISSUE:-none queued}
          State: ${LABEL:-none}

          Take exactly one turn as the role above, then stop. Move the issue to
          its next label so the following turn can happen without a human. If you
          are blocked by a missing credential, permission or payment, label the
          issue blocked-human-only and say precisely what is needed — do not
          guess at a workaround.

          Never print a secret. Green CI is necessary and never sufficient.
          PROMPT
          )

          # The turn is allowed to fail; how it failed decides what that means.
          set +e
          claude -p "$PROMPT" --permission-mode acceptEdits --allowedTools \
              "Bash,Read,Write,Edit,Glob,Grep" \
            > turn.log 2>&1
          STATUS=$?
          set -e

          tail -200 turn.log

          #
          # An unfunded key is not a broken build.
          #
          # The header of this file argues that a workflow which fails loudly every
          # hour because of a missing secret gets switched off, and then nobody
          # notices when the secret arrives. An account with no credit is exactly
          # that failure with a different message: the hourly cron would paint the
          # Actions tab red forever, for a reason no machine in this repository can
          # fix.
          #
          # This happened. Both runs on 2026-07-30 exited on "Credit balance is too
          # low" before the role file was even read, so the first model-driven turn
          # produced nothing at all.
          #
          # So it is reported as a warning and the job passes. The durable record is
          # the blocked-human-only issue, which is where `AUTONOMY.md §6` says a
          # payment blocker lives — not in a red X that stops meaning anything by
          # the fiftieth time you see it.
          #
          if [ "$STATUS" -ne 0 ] && \
             grep -qiE 'credit balance is too low|insufficient (credit|quota|funds)' turn.log; then
            echo "::warning title=Orchestrator is unfunded::The ANTHROPIC_API_KEY account has no credit, so no turn can run. This is AUTONOMY.md section 6 item 4 — authorize payment. Tracked on the blocked-human-only issue; delivery continues by hand until it is resolved."
            exit 0
          fi

          exit "$STATUS"
