name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `16 §12` removes analytics vendors from the product. Next's build telemetry
# is anonymous, but opting out keeps that decision consistent.
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    # Integration tests assert real database constraints, so they need a real
    # database. `identity.test.ts` throws if DATABASE_URL is unset while CI is
    # true, so a missing service fails loudly instead of silently skipping.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tonys
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: tonys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tonys -d tonys_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://tonys:local_dev_only@localhost:5432/tonys_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The clock abstraction only holds if the rule enforcing it is active.
      # A silently disabled rule would be invisible until the time machine
      # failed months from now.
      - name: Verify clock enforcement is active
        run: |
          set -e
          echo 'export const leak = new Date();' > lib/__clock_rule_probe.ts
          if npm run lint --silent; then
            rm -f lib/__clock_rule_probe.ts
            echo "::error::ESLint did not reject a bare new Date(). Clock enforcement is not working."
            exit 1
          fi
          rm -f lib/__clock_rule_probe.ts
          echo "Clock enforcement confirmed active."
