name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch.
  #
  # This used to read `branches: [main]`, which meant a pull request stacked on
  # another pull request's head got Vercel checks and no Typecheck / Lint / Test
  # / Build run at all — silently, with a green tick beside it. A stacked branch
  # is not an unusual case here and the filter's failure mode is invisible, so
  # the trigger covers every base rather than one.
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `16 §12` removes analytics vendors from the product. Next's build telemetry
# is anonymous, but opting out keeps that decision consistent.
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    # A spend cap, not a performance target.
    #
    # Nothing here set a limit, so GitHub's default applied: **360 minutes**.
    # On a metered private allowance (`AUTONOMY.md §4`) one stuck job could
    # therefore bill six hours, and this workflow plus `visual-qa.yml` twelve —
    # far more than the account has ever had spare. That was true from the day
    # the file was written and nobody had noticed.
    #
    # It surfaced on 2026-08-06, and honestly it surfaced by mistake: a session
    # believed both jobs had run 46 minutes and cancelled them, when the real
    # elapsed time was four and a half and both were healthy. The reading was
    # wrong; the exposure it went looking for was real, and unbounded.
    #
    # Fifteen is roughly four times this job's 4-minute median: clear of a slow
    # runner, and a genuine hang is caught in minutes rather than hours.
    timeout-minutes: 15

    # Integration tests assert real database constraints, so they need a real
    # database. `identity.test.ts` throws if DATABASE_URL is unset while CI is
    # true, so a missing service fails loudly instead of silently skipping.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tonys
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: tonys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tonys -d tonys_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://tonys:local_dev_only@localhost:5432/tonys_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The clock abstraction only holds if the rule enforcing it is active.
      # A silently disabled rule would be invisible until the time machine
      # failed months from now.
      - name: Verify clock enforcement is active
        run: |
          set -e
          echo 'export const leak = new Date();' > lib/__clock_rule_probe.ts
          if npm run lint --silent; then
            rm -f lib/__clock_rule_probe.ts
            echo "::error::ESLint did not reject a bare new Date(). Clock enforcement is not working."
            exit 1
          fi
          rm -f lib/__clock_rule_probe.ts
          echo "Clock enforcement confirmed active."
