# Local Postgres for development and integration tests.
#
# `16 §11`: local development uses plain Docker Postgres, never the hosted
# database, so tests run offline and free and no test can reach production.
#
#   npm run db:up      start
#   npm run db:migrate  apply migrations
#   npm run db:down    stop and DELETE the volume

services:
  postgres:
    # Pin the major version to match Neon.
    image: postgres:17-alpine
    container_name: tonys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tonys
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: tonys_dev
    ports:
      - '5432:5432'
    volumes:
      - tonys_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tonys -d tonys_dev']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tonys_pgdata:
